# XcodeGen proje tanımı. GitHub Actions bunu Odak.xcodeproj'a çevirir.
# Aynı kodla iki ayrı uygulama çıkar: Instagram ve YouTube.
name: Odak
options:
  bundleIdPrefix: com.odak
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: App/Info.plist
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # İmzasız derlenir; telefona yüklerken Sideloadly imzalar.
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
targets:
  Instagram:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - path: App/odak.user.js
        buildPhase: resources
      - Icons/Instagram.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.odak.instagram
        ODAK_DISPLAY_NAME: Instagram
        ODAK_START_HOST: www.instagram.com
  YouTube:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - path: App/odak.user.js
        buildPhase: resources
      - Icons/YouTube.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.odak.youtube
        ODAK_DISPLAY_NAME: YouTube
        ODAK_START_HOST: m.youtube.com
